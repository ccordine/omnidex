[package]
name = "omnidex-integration"
version = "0.1.0"
edition = "2021"
description = "Typed client for the Omnidex integration API"
license = "MIT"

[dependencies]
getrandom = "0.2.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.19"
url = "2.5.8"
