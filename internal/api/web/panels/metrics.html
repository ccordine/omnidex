<section data-chat-target="panel" data-panel-name="metrics" class="hidden h-full min-h-0 flex-col">
        <header class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 bg-zinc-950/45 px-4 py-3 backdrop-blur-xl md:px-6">
          <div>
            <p class="text-xs uppercase tracking-[.20em] text-cyan-200/80" data-i18n="panel.metrics.brand">Telemetry</p>
            <h2 class="text-xl font-semibold tracking-tight" data-i18n="panel.metrics.title">Metrics</h2>
          </div>
          <button data-action="chat#loadMetrics" class="rounded-md bg-cyan-300 px-4 py-2 text-sm font-semibold text-zinc-950 transition hover:bg-cyan-200" data-i18n="common.refresh">Refresh</button>
        </header>
        <div class="scrollbar min-h-0 flex-1 overflow-y-auto p-4 md:p-6">
          <div data-chat-target="metricsOutput" data-recyclr-sink="metrics-output" class="space-y-4 text-sm text-zinc-400">
            <div class="flex min-h-[4rem] items-center gap-2 rounded-md border border-white/10 bg-zinc-950/40 px-3 py-3 text-sm text-zinc-400" role="status" aria-live="polite">
              <span class="inline-block h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-cyan-300/25 border-t-cyan-200" aria-hidden="true"></span>
              <span>Loading metrics...</span>
            </div>
          </div>
        </div>
      </section>
