<section data-chat-target="panel" data-panel-name="memory" class="hidden h-full min-h-0 flex-col">
        <header class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 bg-zinc-950/45 px-4 py-3 backdrop-blur-xl md:px-6">
          <div>
            <p class="text-xs uppercase tracking-[.20em] text-cyan-200/80" data-i18n="panel.memory.brand">Knowledge</p>
            <h2 class="text-xl font-semibold tracking-tight" data-i18n="panel.memory.title">Memory</h2>
          </div>
          <div class="flex flex-wrap gap-2">
            <select data-chat-target="memoryKindFilter" data-action="change->chat#loadMemoryCandidates" class="rounded-md border border-white/10 bg-zinc-900 px-3 py-2 text-xs text-zinc-100 outline-none">
              <option value="" data-i18n="panel.memory.allKinds">All kinds</option>
              <option value="reference" data-i18n="memory.kind.reference">reference</option>
              <option value="episodic" data-i18n="memory.kind.episodic">episodic</option>
              <option value="procedural" data-i18n="memory.kind.procedural">procedural</option>
              <option value="instruction" data-i18n="memory.kind.instruction">instruction</option>
              <option value="preference" data-i18n="memory.kind.preference">preference</option>
            </select>
            <button data-action="chat#loadGlobalActivity" class="rounded-md border border-white/10 px-4 py-2 text-sm font-semibold text-zinc-100 transition hover:border-cyan-300/40 hover:bg-cyan-300/10" data-i18n="panel.memory.syncActivity">Sync activity</button>
            <button data-action="chat#loadMemoryCandidates" class="rounded-md bg-cyan-300 px-4 py-2 text-sm font-semibold text-zinc-950 transition hover:bg-cyan-200" data-i18n="panel.memory.refreshMind">Refresh mind</button>
          </div>
        </header>
        <div class="grid min-h-0 flex-1 grid-cols-1 gap-4 p-4 xl:grid-cols-[minmax(0,1fr)_360px] md:p-6">
          <div class="scrollbar min-h-0 space-y-4 overflow-y-auto">
            <section>
              <h3 class="mb-3 text-xs font-semibold uppercase tracking-[.18em] text-zinc-500" data-i18n="panel.memory.durable">Durable memory</h3>
              <div data-chat-target="memoryList" data-recyclr-sink="memory-list" class="space-y-3"></div>
              <div data-recyclr-sink="memory-pagination" class="mt-3 flex justify-center"></div>
            </section>
            <section>
              <h3 class="mb-3 text-xs font-semibold uppercase tracking-[.18em] text-zinc-500" data-i18n="panel.memory.candidates">Candidates</h3>
              <div data-chat-target="memoryCandidates" data-recyclr-sink="memory-candidates" class="space-y-3"></div>
              <div data-recyclr-sink="memory-candidates-pagination" class="mt-3 flex justify-center"></div>
            </section>
          </div>
          <form data-action="submit->chat#addMemory" class="rounded-lg border border-white/10 bg-zinc-950/50 p-4">
            <h3 class="text-sm font-semibold uppercase tracking-[.18em] text-zinc-400" data-i18n="panel.memory.add">Add memory</h3>
            <label class="mt-4 block text-xs text-zinc-500">
              <span data-i18n="panel.memory.kind">Kind</span>
            </label>
            <select data-chat-target="memoryKind" class="mt-1 w-full rounded-md border border-white/10 bg-zinc-900 px-3 py-2 text-sm outline-none">
              <option value="episodic" data-i18n="memory.kind.episodic">episodic</option>
              <option value="procedural" data-i18n="memory.kind.procedural">procedural</option>
              <option value="instruction" data-i18n="memory.kind.instruction">instruction</option>
              <option value="preference" data-i18n="memory.kind.preference">preference</option>
              <option value="reference" data-i18n="memory.kind.reference">reference</option>
            </select>
            <label class="mt-4 block text-xs text-zinc-500">
              <span data-i18n="panel.memory.tags">Tags</span>
            </label>
            <input data-chat-target="memoryTags" class="mt-1 w-full rounded-md border border-white/10 bg-zinc-900 px-3 py-2 text-sm outline-none" data-i18n-placeholder="panel.memory.tagsPlaceholder" placeholder="comma,separated,tags" />
            <label class="mt-4 block text-xs text-zinc-500">
              <span data-i18n="panel.memory.content">Content</span>
            </label>
            <textarea data-chat-target="memoryContent" rows="8" class="scrollbar mt-1 w-full rounded-md border border-white/10 bg-zinc-900 px-3 py-2 text-sm outline-none" data-i18n-placeholder="panel.memory.contentPlaceholder" placeholder="Durable fact, preference, instruction, or reference..."></textarea>
            <button class="mt-4 w-full rounded-md bg-cyan-300 px-4 py-2 text-sm font-semibold text-zinc-950 transition hover:bg-cyan-200" data-i18n="panel.memory.save">Save memory</button>
          </form>
        </div>
      </section>
