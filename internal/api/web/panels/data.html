<section data-chat-target="panel" data-panel-name="data" data-controller="data" class="hidden h-full min-h-0 flex-col">
        <header class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 bg-zinc-950/45 px-4 py-3 backdrop-blur-xl md:px-6">
          <div>
            <p class="text-xs uppercase tracking-[.20em] text-cyan-200/80">Database analytics</p>
            <h2 class="text-xl font-semibold tracking-tight">Data</h2>
            <p class="mt-1 text-xs text-zinc-500">Chat with your databases — natural language queries, SQL, tables, and D3 charts.</p>
          </div>
          <button data-action="data#load" type="button" class="rounded-md border border-white/10 px-4 py-2 text-sm font-semibold text-zinc-100 transition hover:border-cyan-300/40 hover:bg-cyan-300/10">Refresh</button>
        </header>
        <div data-data-target="panel" class="min-h-0 flex-1">
          <div class="flex min-h-[4rem] items-center gap-2 rounded-md border border-white/10 bg-zinc-950/40 px-3 py-3 text-sm text-zinc-400" role="status" aria-live="polite">
            <span class="inline-block h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-cyan-300/25 border-t-cyan-200" aria-hidden="true"></span>
            <span>Loading data...</span>
          </div>
        </div>
      </section>
