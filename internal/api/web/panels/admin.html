<section data-chat-target="panel" data-panel-name="admin" data-controller="admin" data-action="admin-data-sources:status->admin#receiveStatus" class="hidden h-full min-h-0 flex-col">
        <header class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 bg-zinc-950/45 px-4 py-3 backdrop-blur-xl md:px-6">
          <div>
            <p class="text-xs uppercase tracking-[.20em] text-cyan-200/80" data-i18n="panel.admin.brand">Workspace</p>
            <h2 class="text-xl font-semibold tracking-tight" data-i18n="panel.admin.title">Admin</h2>
            <p class="mt-1 text-xs text-zinc-500" data-i18n="panel.admin.subtitle">Network, models, health checks, and maintenance.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <span data-admin-target="adminStatus" class="text-xs text-zinc-400" data-i18n="panel.admin.openToLoad">Open to load</span>
            <button data-action="admin#load" type="button" class="rounded-md border border-white/10 px-4 py-2 text-sm font-semibold text-zinc-100 transition hover:border-cyan-300/40 hover:bg-cyan-300/10" data-i18n="common.refresh">Refresh</button>
            <button data-action="admin#loadHealth" type="button" class="rounded-md bg-cyan-300 px-4 py-2 text-sm font-semibold text-zinc-950 transition hover:bg-cyan-200" data-i18n="panel.admin.healthCheck">Health check</button>
          </div>
        </header>

        <div class="border-b border-white/10 bg-zinc-950/30 px-4 py-3 md:px-6">
          <nav data-admin-target="tabNav" class="flex flex-wrap gap-2" data-i18n-aria="panel.admin.sections" aria-label="Admin sections">
            <button type="button" data-action="admin#showTab" data-admin-tab="overview" class="rounded-md border border-cyan-300/40 bg-cyan-300/10 px-3 py-2 text-sm font-medium text-cyan-100 transition" data-i18n="panel.admin.tab.overview">Overview</button>
            <button type="button" data-action="admin#showTab" data-admin-tab="ai" class="rounded-md border border-white/10 px-3 py-2 text-sm font-medium text-zinc-400 transition hover:border-cyan-300/30 hover:text-zinc-200" data-i18n="panel.admin.tab.ai">Models</button>
            <button type="button" data-action="admin#showTab" data-admin-tab="datasources" class="rounded-md border border-white/10 px-3 py-2 text-sm font-medium text-zinc-400 transition hover:border-cyan-300/30 hover:text-zinc-200" data-i18n="panel.admin.tab.dataSources">Data sources</button>
            <button type="button" data-action="admin#showTab" data-admin-tab="health" class="rounded-md border border-white/10 px-3 py-2 text-sm font-medium text-zinc-400 transition hover:border-cyan-300/30 hover:text-zinc-200" data-i18n="panel.admin.tab.health">Health</button>
            <button type="button" data-action="admin#showTab" data-admin-tab="advanced" class="rounded-md border border-white/10 px-3 py-2 text-sm font-medium text-zinc-400 transition hover:border-cyan-300/30 hover:text-zinc-200" data-i18n="panel.admin.tab.advanced">Advanced</button>
          </nav>
        </div>

        <div class="scrollbar min-h-0 flex-1 overflow-y-auto p-4 md:p-6">
          <div data-admin-target="tabPanel" data-recyclr-sink="admin-tab-panel" class="mx-auto max-w-5xl space-y-4">
            <div class="flex min-h-[4rem] items-center gap-2 rounded-md border border-white/10 bg-zinc-950/40 px-3 py-3 text-sm text-zinc-400" role="status" aria-live="polite">
              <span class="inline-block h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-cyan-300/25 border-t-cyan-200" aria-hidden="true"></span>
              <span data-i18n="panel.admin.loading">Loading admin…</span>
            </div>
          </div>
        </div>
      </section>
