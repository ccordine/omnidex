services:
  core:
    image: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be configured}-core
    # The rootful daemon exposes the bind with host ownership unchanged. Pin
    # the core process to that exact owner so host mutations remain user-owned.
    user: "${HOST_UID:?HOST_UID must match the owner of HOST_WORKSPACE_PATH}:${HOST_GID:?HOST_GID must match the group of HOST_WORKSPACE_PATH}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${HOST_UID:?HOST_UID must match the owner of HOST_WORKSPACE_PATH}
        APP_GID: ${HOST_GID:?HOST_GID must match the group of HOST_WORKSPACE_PATH}
        OMNIDEX_COMMIT: ${OMNIDEX_COMMIT:-}
    # APP_UID/APP_GID keep the image account aligned with the explicit runtime
    # identity above and with the host-authoritative workspace bind.
    # Bubblewrap creates the unprivileged user namespace that encloses
    # existing-repository verification. These options permit that nested
    # namespace syscall without granting the core process root identity.
    # The Docker socket group remains supplementary authority for the daemon.
    group_add:
      - ${DOCKER_GID:?DOCKER_GID must match the numeric group owner of /var/run/docker.sock}
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    env_file:
      - .env
    environment:
      # Host .env sometimes sets PATH for the bridge; never let that override the container PATH.
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # A trimpath-built core cannot infer the copied toolchain root for go/importer.
      GOROOT: /usr/local/go
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:8090}
      CORE_URL: ${CORE_URL:?CORE_URL must be configured}
      WRAPPER_ONLY: ${WRAPPER_ONLY:-false}
      DATABASE_URL: ${DATABASE_URL:-postgres://agent:agent@postgres:5432/agent?sslmode=disable}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-omnidex_runtime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UI_REDIS_REQUIRED: ${UI_REDIS_REQUIRED:-false}
      UI_SESSION_TTL: ${UI_SESSION_TTL:-30m}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ORGANIZATION: ${OPENAI_ORGANIZATION:-}
      OPENAI_PROJECT: ${OPENAI_PROJECT:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AZURE_AI_BASE_URL: ${AZURE_AI_BASE_URL:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_AI_API_VERSION: ${AZURE_AI_API_VERSION:-}
      AZURE_AI_API_STYLE: ${AZURE_AI_API_STYLE:-}
      AZURE_AI_EMBEDDING_MODEL: ${AZURE_AI_EMBEDDING_MODEL:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      WEB_SEARCH_PROVIDERS: ${WEB_SEARCH_PROVIDERS:-brave,google,reddit}
      WEB_SEARCH_TIMEOUT: ${WEB_SEARCH_TIMEOUT:-15s}
      WEB_SEARCH_PER_SOURCE_BUDGET: ${WEB_SEARCH_PER_SOURCE_BUDGET:-3000}
      WEB_SEARCH_TOTAL_BUDGET: ${WEB_SEARCH_TOTAL_BUDGET:-6000}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      HOST_WORKSPACE_PATH: ${HOST_WORKSPACE_PATH:-}
      # Dependency acquisition and offline verification share one durable,
      # code-owned cache. The verification sandbox receives only its exact
      # checksum-proven module projection, never this whole volume.
      GOMODCACHE: /var/cache/omnidex/gomod
      OMNIDEX_DEPLOYMENT_KEY_FILE: /var/lib/omnidex-deployment/key
      OMNIDEX_DEPLOYMENT_BIND_ADDRESS: ${OMNIDEX_DEPLOYMENT_BIND_ADDRESS:-}
      OMNIDEX_DEPLOYMENT_ADVERTISED_HOST: ${OMNIDEX_DEPLOYMENT_ADVERTISED_HOST:-}
      OMNIDEX_DEPLOYMENT_PROBE_HOST: ${OMNIDEX_DEPLOYMENT_PROBE_HOST:-}
      WORKER_COUNT: ${WORKER_COUNT:-3}
      CODING_FRAGMENT_CONCURRENCY: ${CODING_FRAGMENT_CONCURRENCY:-1}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10m}
      HOST_AGENT_URL: ${HOST_AGENT_URL:-}
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN:-}
      HOST_BRIDGE_PUBLIC_WS_URL: ${HOST_BRIDGE_PUBLIC_WS_URL:-}
      # Generated Docker verification is still code-owned. The client may use
      # only this mounted default Unix socket; TCP Docker endpoints are rejected.
      DOCKER_HOST: unix:///var/run/docker.sock
      INFERENCE_CONTEXT_TOKENS: ${INFERENCE_CONTEXT_TOKENS:?INFERENCE_CONTEXT_TOKENS must be configured}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    depends_on:
      runtime-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${HOST_WORKSPACE_PATH:?HOST_WORKSPACE_PATH must be set to an absolute project root}
        target: /workspace
        bind:
          create_host_path: false
      # Docker Compose resolves relative bind sources for the host daemon. Mirror
      # the same source at its host-absolute path so Docker-only commands can use
      # that identity while every other command remains under /workspace.
      - type: bind
        source: ${HOST_WORKSPACE_PATH:?HOST_WORKSPACE_PATH must be set to an absolute project root}
        target: ${HOST_WORKSPACE_PATH:?HOST_WORKSPACE_PATH must be set to an absolute project root}
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: volume
        source: deploymentkeys
        target: /var/lib/omnidex-deployment
      - type: volume
        source: gomodcache
        target: /var/cache/omnidex/gomod
    networks:
      - omnidex-edge
      - omnidex-backend
      # WorkNet Edge publishes omni.worknet through its declared shared app network.
      - dev-net
    restart: unless-stopped

  runtime-volume-init:
    image: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be configured}-core
    user: "0:0"
    command:
      - /usr/local/bin/initialize-omnidex-volumes
      - ${HOST_UID:?HOST_UID must match the owner of HOST_WORKSPACE_PATH}
      - ${HOST_GID:?HOST_GID must match the group of HOST_WORKSPACE_PATH}
      - /var/lib/omnidex-deployment
      - /var/cache/omnidex/gomod
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: volume
        source: deploymentkeys
        target: /var/lib/omnidex-deployment
      - type: volume
        source: gomodcache
        target: /var/cache/omnidex/gomod
    restart: "no"

  postgres:
    image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - omnidex-backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    networks:
      - omnidex-backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  deploymentkeys:
  gomodcache:

networks:
  omnidex-edge:
    driver: bridge
    ipam:
      config:
        # WorkNet permits Docker-to-host Ollama only from 172.16.0.0/12.
        - subnet: 172.16.90.0/24
  omnidex-backend:
    driver: bridge
    internal: true
  dev-net:
    external: true
    name: dev-net
