services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    env_file:
      - .env
    environment:
      # Host .env sometimes sets PATH for the bridge; never let that override the container PATH.
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:8090}
      CORE_URL: ${CORE_URL:-https://omni.worknet}
      WRAPPER_ONLY: ${WRAPPER_ONLY:-false}
      DATABASE_URL: ${DATABASE_URL:-postgres://agent:agent@postgres:5432/agent?sslmode=disable}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-omnidex_runtime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UI_REDIS_REQUIRED: ${UI_REDIS_REQUIRED:-false}
      UI_SESSION_TTL: ${UI_SESSION_TTL:-30m}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ORGANIZATION: ${OPENAI_ORGANIZATION:-}
      OPENAI_PROJECT: ${OPENAI_PROJECT:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AZURE_AI_BASE_URL: ${AZURE_AI_BASE_URL:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_AI_API_VERSION: ${AZURE_AI_API_VERSION:-}
      AZURE_AI_API_STYLE: ${AZURE_AI_API_STYLE:-}
      AZURE_AI_EMBEDDING_MODEL: ${AZURE_AI_EMBEDDING_MODEL:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      WEB_SEARCH_PROVIDERS: ${WEB_SEARCH_PROVIDERS:-duckduckgo,google,reddit}
      WEB_SEARCH_TIMEOUT: ${WEB_SEARCH_TIMEOUT:-15s}
      WEB_SEARCH_PER_SOURCE_BUDGET: ${WEB_SEARCH_PER_SOURCE_BUDGET:-3000}
      WEB_SEARCH_TOTAL_BUDGET: ${WEB_SEARCH_TOTAL_BUDGET:-6000}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      HOST_WORKSPACE_PATH: ${HOST_WORKSPACE_PATH:-}
      WORKER_COUNT: ${WORKER_COUNT:-3}
      CODING_FRAGMENT_CONCURRENCY: ${CODING_FRAGMENT_CONCURRENCY:-1}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-180s}
      HOST_AGENT_URL: ${HOST_AGENT_URL:-}
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN:-}
      HOST_BRIDGE_PUBLIC_WS_URL: ${HOST_BRIDGE_PUBLIC_WS_URL:-}
      OMNI_ENABLE_CURSOR_ARCHITECT: ${OMNI_ENABLE_CURSOR_ARCHITECT:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      OMNI_ENABLE_CODEX_ARCHITECT: ${OMNI_ENABLE_CODEX_ARCHITECT:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      INFERENCE_CONTEXT_TOKENS: ${INFERENCE_CONTEXT_TOKENS:?INFERENCE_CONTEXT_TOKENS must be configured}
      MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
    expose:
      - "8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_WORKSPACE_PATH:?HOST_WORKSPACE_PATH must be set to an absolute project root}:/workspace:rw
    networks:
      - omnidex-edge
      - omnidex-backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - omnidex-backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    networks:
      - omnidex-backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  omnidex-edge:
    driver: bridge
    ipam:
      config:
        # WorkNet permits Docker-to-host Ollama only from 172.16.0.0/12.
        - subnet: 172.16.90.0/24
  omnidex-backend:
    driver: bridge
    internal: true
